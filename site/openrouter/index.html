<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signing in · Lactic</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px -apple-system,system-ui,sans-serif;background:#f4f5f7;color:#0d1117;text-align:center;padding:24px}p{color:#5d6573}</style>
</head><body><main><h1 id="t" style="font-size:22px;font-weight:600">Back to Lactic…</h1><p id="p">Finishing your OpenRouter sign-in.</p></main>
<script>
// Sign in with OpenRouter comes back here. This page keeps nothing: it passes the one-time code on
// to the Lactic app, which swaps it for a key with OpenRouter using a secret that never left the
// rider's device (app/src-tauri/src/openrouter.rs). `state` says where the app is waiting:
// "<port>-<hex>" on this computer at 127.0.0.1:<port>, "app-<hex>" in the iPhone app.
(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get("code") || "";
  var state = q.get("state") || "";
  function say(t, p) { document.getElementById("t").textContent = t; document.getElementById("p").textContent = p; }
  if (!code || !/^[A-Za-z0-9._~-]{1,512}$/.test(code)) return say("Not signed in", "OpenRouter didn't finish the sign-in. Go back to Lactic and try again.");
  var pass = "?code=" + encodeURIComponent(code) + "&state=" + encodeURIComponent(state);
  history.replaceState(null, "", location.pathname);
  var desk = /^(\d{2,5})-[0-9a-f]{32}$/.exec(state);
  if (desk && +desk[1] > 1023 && +desk[1] < 65536) return location.replace("http://127.0.0.1:" + desk[1] + "/openrouter" + pass);
  if (/^app-[0-9a-f]{32}$/.test(state)) return location.replace("lactic://lactic.fit/openrouter" + pass);
  say("That sign-in link is out of date", "Go back to Lactic and choose Sign in with OpenRouter again.");
})();
</script>
</body></html>
