<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lactic</title>
<meta name="description" content="Lactic: free, open-source structured training for cyclists. Coming soon.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg: #f5f6f8; --ink: #0d1117; --muted: #5d6573; --blue: #2b55d6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --ink: #f2f3f5; --muted: #8b919c; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { padding: 24px; display: grid; gap: 16px; justify-items: center; text-align: center; }
  .mark { width: 72px; height: 72px; border-radius: 16px; background: var(--blue); color: #fff; display: grid; place-items: center; }
  h1 { margin: 0; font-size: 44px; letter-spacing: -0.03em; }
  p { margin: 0; font-size: 18px; line-height: 1.5; color: var(--muted); max-width: 34ch; }
</style>
</head>
<body>
<main>
  <div class="mark"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M2 21V15H4.5V10.5H7V6.5H9.5V3H12V15H22V21Z" fill="currentColor"/></svg></div>
  <h1>Lactic</h1>
  <p>Free, open-source structured training for cyclists. Coming soon.</p>
</main>
</body>
</html>
