name: App

on:
  push:
    branches: [main]
    # A version tag (v0.2.0) also publishes the three apps as a GitHub release.
    tags: ["v*"]
    paths: ["app/**", ".github/workflows/app.yml"]
  # Every pull request runs this workflow, so `check` always reports and is safe to require on
  # main. When nothing under app/ changed, `changes` says so and the rest is skipped (a skipped
  # job counts as passing).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release for the version in tauri.conf.json (creates the v tag)"
        type: boolean
        default: false

# Each job asks for more only where it needs it (the two that publish a release).
permissions:
  contents: read

# One run at a time per pull request: a new push cancels the run it replaces. On main, a running
# build finishes, and pushes that land meanwhile wait as one queued run (each newer push replaces
# the waiting one), so a burst of merges builds Preview once instead of once per merge.
concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.files.outputs.app }}
    steps:
      - name: Did this pull request change the app?
        id: files
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api "repos/$GH_REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qE '^(app/|\.github/workflows/app\.yml$)'; then app=true; else app=false; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "App changed: $app"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}

  check:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04 # pinned: the 26.04 image fails to fetch the Tauri Linux packages
    outputs:
      # "release": this run ships v<version> (a version tag, a manual run with "release" ticked,
      # or main with a version that has no release yet). "preview": everything else (pull
      # requests, the rest of main) builds Lactic Preview, a separate testing app with its own
      # data, keychain item and updates (src-tauri/tauri.preview.conf.json).
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.channel.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Release or preview build
        id: channel
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          channel=preview
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "$RELEASE_INPUT" = true ]; then
            channel=release
          elif [ "$GITHUB_REF" = refs/heads/main ] && ! gh release view "v$version" >/dev/null 2>&1; then
            channel=release
          fi
          # Previews count up with the run, so an installed Preview sees each newer one as an update.
          if [ "$channel" = preview ]; then version="$version-preview.$GITHUB_RUN_NUMBER"; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $channel $version"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npx vite build
        working-directory: app
      - name: Linux packages for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: app/src-tauri
      - run: cargo check --locked
        working-directory: app/src-tauri
      - run: cargo test --locked --lib
        working-directory: app/src-tauri

  package:
    # The installable apps, attached to the run: a universal .dmg (Apple silicon and Intel Macs),
    # a Windows installer, and a Linux AppImage and .deb. With the release key
    # (TAURI_SIGNING_PRIVATE_KEY) each also gets an update signature (.sig) and the Mac its
    # Lactic.app.tar.gz, which installed copies download to update themselves.
    # With the Apple secrets (APPLE_CERTIFICATE and friends, see app/README.md) the Mac app is
    # signed with Lactic's Developer ID and notarized by Apple, so it opens with no Terminal step.
    # Without them (forks) it falls back to the ad-hoc signature.
    # Preview runs build Lactic Preview instead (artifacts named Lactic-macOS-Preview and so on).
    # Draft pull requests stop at `check`; marking one ready for review builds the apps.
    # Pull request Mac builds are Apple silicon only and signed but not notarized: they're for
    # trying a change (app/scripts/try-preview.sh clears the download flag), and that halves the
    # Mac build. main and releases stay universal and notarized.
    needs: check
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: Lactic-macOS
            bundles: app,dmg
            # One app for both kinds of Mac (Apple silicon only on pull requests, see above).
            target: ${{ github.event_name == 'pull_request' && 'aarch64-apple-darwin' || 'universal-apple-darwin' }}
            rust-targets: ${{ github.event_name == 'pull_request' && 'aarch64-apple-darwin' || 'aarch64-apple-darwin,x86_64-apple-darwin' }}
            files: |
              app/src-tauri/target/*-apple-darwin/release/bundle/dmg/*.dmg
              app/src-tauri/target/*-apple-darwin/release/bundle/macos/*.app.tar.gz
              app/src-tauri/target/*-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - os: windows-latest
            name: Lactic-Windows
            bundles: nsis
            files: |
              app/src-tauri/target/release/bundle/nsis/*.exe
              app/src-tauri/target/release/bundle/nsis/*.exe.sig
          - os: ubuntu-22.04
            name: Lactic-Linux
            bundles: appimage,deb
            files: |
              app/src-tauri/target/release/bundle/appimage/*.AppImage
              app/src-tauri/target/release/bundle/appimage/*.AppImage.sig
              app/src-tauri/target/release/bundle/deb/*.deb
              app/src-tauri/target/release/bundle/deb/*.deb.sig
    runs-on: ${{ matrix.os }}
    env:
      # The signing secrets themselves are only handed to the steps that sign (after everything is
      # compiled), so installing packages and building, which run code from every dependency,
      # never see them. These just say whether each is set ("false" on pull requests from forks,
      # whose builds skip the update files and fall back to the ad-hoc signature).
      UPDATE_SIGNING: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      MAC_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      CHANNEL: ${{ needs.check.outputs.channel }}
      VERSION: ${{ needs.check.outputs.version }}
      # The screens say Preview instead of Beta in a preview build (src/app/beta.ts).
      VITE_LACTIC_CHANNEL: ${{ needs.check.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf
      - run: npm ci
        working-directory: app
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets || '' }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: app/src-tauri
      - name: Compile
        # No signing secrets here: this step runs build scripts from every dependency.
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -n "${{ matrix.target }}" ]; then args+=(--target ${{ matrix.target }}); fi
          if [ "$UPDATE_SIGNING" = true ]; then args+=(--config src-tauri/tauri.updater.conf.json); fi
          if [ "$CHANNEL" = preview ]; then
            # Lactic Preview: its own name, bundle id, icon and update feed, at this run's version.
            printf '{"version":"%s"}' "$VERSION" > src-tauri/tauri.version.conf.json
            args+=(--config src-tauri/tauri.preview.conf.json --config src-tauri/tauri.version.conf.json)
          fi
          # The same settings go to the bundle step below.
          printf '%s\n' ${args[@]+"${args[@]}"} > "$RUNNER_TEMP/tauri-args"
          npx tauri build --no-bundle ${args[@]+"${args[@]}"}
        working-directory: app
      - name: Developer ID certificate and notarization key (Mac)
        # Puts the certificate in a throwaway keychain and hands Tauri its identity
        # (APPLE_SIGNING_IDENTITY overrides the ad-hoc "-" in tauri.conf.json). With the App Store
        # Connect key, Tauri also notarizes and staples the app.
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/lactic-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # Apple's Developer ID intermediate, in case the exported .p12 left it out.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" -T /usr/bin/codesign || true
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"' || true)
          if [ -z "$identity" ]; then
            security find-identity -v -p codesigning "$keychain"
            echo "::error::No 'Developer ID Application' identity in APPLE_CERTIFICATE. Export the certificate together with its private key as a .p12."
            exit 1
          fi
          echo "Signing as $identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "Pull request build: signed, not notarized."
          elif [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            {
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Signed but not notarized: set APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_KEY_P8 too, or the Mac still blocks the app on first open."
          fi
      - name: Bundle and sign
        # The compiled app becomes installers here, signed for updates (and, on a Mac, with the
        # Developer ID from the step above, then notarized).
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r line; do [ -n "$line" ] && args+=("$line"); done < "$RUNNER_TEMP/tauri-args"
          npx tauri bundle --bundles ${{ matrix.bundles }} ${args[@]+"${args[@]}"}
        working-directory: app
      - name: Notarize the .dmg too (Mac)
        # Tauri notarizes the app inside; notarizing and stapling the disk image as well means
        # the Mac checks it once, offline, when it's opened.
        if: runner.os == 'macOS' && env.APPLE_API_KEY_PATH != ''
        run: |
          set -euo pipefail
          dmg=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature -v "$dmg"
          spctl --assess --type execute -v "$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)"
        working-directory: app
      - name: Clean up the signing keychain (Mac)
        if: always() && runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/lactic-signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}${{ needs.check.outputs.channel == 'preview' && '-Preview' || '' }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    # A GitHub release with the three apps attached, tagged v<version from tauri.conf.json>:
    # whenever main has a version with no release yet (bump the version, merge, and it ships),
    # on a version tag, or on a manual run with "release" ticked.
    if: needs.check.outputs.channel == 'release'
    needs: [check, package]
    runs-on: ubuntu-latest
    # Publishing goes through the "release" environment. With James as its required reviewer
    # (repo Settings → Environments → release), nothing ships to riders until he approves the run.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: The app's version, and the tag to match it
        id: version
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but tauri.conf.json says $version"; exit 1; }
          elif gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; bump the version to ship a new one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Update files (latest.json), which installed copies check on every start
        if: steps.version.outputs.skip != 'true'
        run: |
          # The Mac update bundle comes out as Lactic.app.tar.gz; give it the version and arch
          # (universal: one app for Apple silicon and Intel, listed under both in latest.json).
          # (Artifacts with several folders keep them, so it lands in dist/macos/.)
          mac=$(find dist -name Lactic.app.tar.gz | head -1)
          if [ -z "$mac" ]; then echo "No Lactic.app.tar.gz: is TAURI_SIGNING_PRIVATE_KEY set?"; exit 1; fi
          mv "$mac" "$(dirname "$mac")/Lactic_${VERSION}_universal.app.tar.gz"
          mv "$mac.sig" "$(dirname "$mac")/Lactic_${VERSION}_universal.app.tar.gz.sig"
          # What's new, for the update card and the top of the release page: this version's
          # section of app/whats-new.md, written for riders.
          node app/scripts/update-manifest.mjs dist "$VERSION" "$GITHUB_REPOSITORY" app/whats-new.md > dist/latest.json
          cat dist/latest.json
          notes=$(node app/scripts/update-manifest.mjs --notes app/whats-new.md "$VERSION")
          [ -n "$notes" ] || echo "::warning::app/whats-new.md has no '## $VERSION' section, so the update card shows no notes."
          {
            if [ -n "$notes" ]; then printf "## What's new\n\n%s\n\n" "$notes"; fi
            cat .github/release-body.md
          } > release-body.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: steps.version.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # Beta until James says otherwise (see app/src/app/beta.ts).
          name: Lactic ${{ steps.version.outputs.tag }} (Beta)
          files: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.app.tar.gz
            dist/**/*.sig
            dist/latest.json
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: release-body.md

  preview:
    # Lactic Preview from main: each push to main that isn't a release replaces the rolling
    # `preview` pre-release, which installed Preview apps update from (tauri.preview.conf.json).
    # It's a pre-release and never "latest", so the site, the README links and the release
    # updater (releases/latest/download/latest.json) never see it.
    if: needs.check.outputs.channel == 'preview' && github.ref == 'refs/heads/main'
    needs: [check, package]
    runs-on: ubuntu-latest
    concurrency:
      group: preview-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-Preview"
          merge-multiple: true
      - name: Name the files and write latest.json
        run: |
          set -euo pipefail
          # Release file names can't have spaces: "Lactic Preview_..." becomes "Lactic-Preview_...".
          find dist -type f -name '* *' -print0 | while IFS= read -r -d '' f; do mv "$f" "$(dirname "$f")/$(basename "$f" | tr ' ' '-')"; done
          mac=$(find dist -name Lactic-Preview.app.tar.gz | head -1)
          if [ -z "$mac" ]; then echo "No Lactic-Preview.app.tar.gz: is TAURI_SIGNING_PRIVATE_KEY set?"; exit 1; fi
          mv "$mac" "$(dirname "$mac")/Lactic-Preview_${VERSION}_universal.app.tar.gz"
          mv "$mac.sig" "$(dirname "$mac")/Lactic-Preview_${VERSION}_universal.app.tar.gz.sig"
          node app/scripts/update-manifest.mjs dist "$VERSION" "$GITHUB_REPOSITORY" app/whats-new.md preview > latest.json
          mv latest.json dist/latest.json
          cat dist/latest.json
          notes=$(node app/scripts/update-manifest.mjs --notes app/whats-new.md Next)
          {
            printf 'Built from %s (%s).\n\n' "${GITHUB_SHA::7}" "$(git log -1 --format=%s)"
            if [ -n "$notes" ]; then printf "## Coming in the next release\n\n%s\n\n" "$notes"; fi
            cat .github/preview-body.md
          } > preview-body.md
      - name: Replace the preview release
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find dist -type f -print0)
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Lactic Preview $VERSION (testing build)" --notes-file preview-body.md "${files[@]}"
