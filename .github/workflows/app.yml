name: App

on:
  push:
    branches: [main]
    # A version tag (v0.2.0) also publishes the three apps as a GitHub release.
    tags: ["v*"]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npx vite build
        working-directory: app
      - name: Linux packages for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo check --locked
        working-directory: app/src-tauri

  package:
    # The installable apps, unsigned for now, attached to the run:
    # a .dmg for Apple silicon Macs, a Windows installer, and a Linux AppImage and .deb.
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: Lactic-macOS
            bundles: dmg
            files: app/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: Lactic-Windows
            bundles: nsis
            files: app/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            name: Lactic-Linux
            bundles: appimage,deb
            files: |
              app/src-tauri/target/release/bundle/appimage/*.AppImage
              app/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf
      - run: npm ci
        working-directory: app
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npx tauri build --bundles ${{ matrix.bundles }}
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    # On a version tag: a GitHub release with the three apps attached.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag matches the app's version
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but tauri.conf.json says $version"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          name: Lactic ${{ github.ref_name }}
          files: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.deb
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Download

            - **Mac (Apple silicon):** `Lactic_*_aarch64.dmg`. Drag Lactic to Applications, then run `xattr -cr /Applications/Lactic.app` once in Terminal (the app isn't signed yet).
            - **Windows:** `Lactic_*_x64-setup.exe`. Windows warns about an unknown publisher; choose More info, then Run anyway.
            - **Linux:** `Lactic_*_amd64.AppImage` (`chmod +x`, then run it) or `Lactic_*_amd64.deb` (`sudo apt install ./Lactic_*_amd64.deb`).
