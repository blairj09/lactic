name: Android app

# Lactic for Android: the same app (app/), built for Android. The Gradle project is generated fresh
# on each run (tauri android init, .github/scripts/android-project.sh), like the iPhone's Xcode
# project.
#
# Every run builds a debug APK (signed with a throwaway debug key, so it installs on an emulator or
# a phone with "install unknown apps" on) and runs it on an Android 14 emulator: the smoke test
# drives the app through its WebView against a stand-in computer and checks pairing, the sealed
# link, Health Connect and the core.
#
# Once the upload key is in GitHub secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, optional ANDROID_KEY_PASSWORD), pushes to main and modular-ui also build a
# signed Play bundle (.aab). With a Play service account key in PLAY_SERVICE_ACCOUNT_JSON too, pushes
# to main upload that bundle to Play's internal testing track (like TestFlight for the iPhone).

on:
  push:
    branches: [main, modular-ui]
    paths: ["app/**", ".github/workflows/android.yml", ".github/scripts/android-*"]
  pull_request:
    paths: ["app/**", ".github/workflows/android.yml", ".github/scripts/android-*"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: android
      - name: Gradle project
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          NDK_HOME=$ANDROID_NDK_LATEST_HOME ../.github/scripts/android-project.sh
        working-directory: app
      - name: Debug APK (phones and the emulator)
        run: npx tauri android build --apk --debug --target aarch64 x86_64
        working-directory: app
      - name: Find the APK
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$apk"
          ls -la "$(dirname "$apk")"
          echo "APK=app/$apk" >> "$GITHUB_ENV"
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: Lactic-Android-debug
          path: ${{ env.APK }}

  emulator:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: Lactic-Android-debug
          path: apk
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Stand-in computer
        run: |
          OUT=android-smoke nohup node .github/scripts/android-computer.mjs > computer.log 2>&1 &
          sleep 1
          cat computer.log
      - name: Smoke test on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: android-smoke

  aab:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Upload key
        id: key
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::notice::No Android upload key in secrets yet, so no Play bundle."
            echo "have=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "have=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.key.outputs.have == 'true'
      - uses: actions/setup-java@v4
        if: steps.key.outputs.have == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v5
        if: steps.key.outputs.have == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        if: steps.key.outputs.have == 'true'
        working-directory: app
      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.have == 'true'
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        if: steps.key.outputs.have == 'true'
        with:
          workspaces: app/src-tauri
          key: android-release
      - name: Gradle project
        if: steps.key.outputs.have == 'true'
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          NDK_HOME=$ANDROID_NDK_LATEST_HOME ../.github/scripts/android-project.sh
        working-directory: app
      # Play wants a bigger versionCode on every upload: the run number, past any code Tauri
      # would derive from the version.
      - name: Play bundle
        if: steps.key.outputs.have == 'true'
        run: npx tauri android build --aab --target aarch64 armv7 x86_64 --config "{\"bundle\":{\"android\":{\"versionCode\":$((100000 + GITHUB_RUN_NUMBER))}}}"
        working-directory: app
      - name: Find the bundle
        if: steps.key.outputs.have == 'true'
        run: |
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -1)
          test -n "$aab"
          echo "AAB=app/$aab" >> "$GITHUB_ENV"
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.have == 'true'
        with:
          name: Lactic-Android-play
          path: ${{ env.AAB }}
      # Internal testing on Play. A Play app that has never been published only takes draft
      # releases, so if a completed release is refused, the same bundle goes up as a draft to roll
      # out by hand in Play Console.
      - name: Upload to Play internal testing
        id: play
        if: steps.key.outputs.have == 'true' && env.HAS_PLAY == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fit.lactic.app
          releaseFiles: ${{ env.AAB }}
          track: internal
          status: completed
      - name: Upload to Play internal testing (draft)
        if: steps.play.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fit.lactic.app
          releaseFiles: ${{ env.AAB }}
          track: internal
          status: draft
