<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lactic</title>
    <script>try{var t=localStorage.getItem("mycoach:theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <style>
      /* Loading screen until the app draws over it: the Lactic mark building one interval at a time, then the name. */
      html, body { margin: 0; background: #f5f6f8; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #000; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #000; } }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot-mark { display: flex; align-items: center; gap: 14px; color: #0d1117; font: 700 30px/1 "Archivo Variable", "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.02em; }
      html[data-theme="dark"] .boot-mark { color: #f5f6f8; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) .boot-mark { color: #f5f6f8; } }
      .boot-mark svg { width: 52px; height: 52px; color: #2b55d6; overflow: visible; }
      .boot-mark rect, .boot-name { animation: boot-build 2.6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite both; }
      .boot-mark rect { transform-box: fill-box; transform-origin: 50% 100%; }
      .boot-mark rect:nth-child(2) { animation-delay: 0.16s; }
      .boot-mark rect:nth-child(3) { animation-delay: 0.32s; }
      .boot-mark rect:nth-child(4) { animation-delay: 0.48s; }
      .boot-mark rect:nth-child(5) { animation-delay: 0.64s; }
      .boot-name { animation-name: boot-name; animation-delay: 0.85s; }
      @keyframes boot-build { 0% { transform: scaleY(0); opacity: 1; } 14% { transform: scaleY(1); } 80% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
      @keyframes boot-name { 0% { transform: translateX(-6px); opacity: 0; } 12% { transform: none; opacity: 1; } 55% { opacity: 1; } 68% { opacity: 0; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .boot-mark rect, .boot-name { animation: none; } }
    </style>
  </head>
  <body class="antialiased">
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Lactic">
        <div class="boot-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="15" width="2.8" height="6" fill="currentColor" /><rect x="4.5" y="10.5" width="2.8" height="10.5" fill="currentColor" /><rect x="7" y="6.5" width="2.8" height="14.5" fill="currentColor" /><rect x="9.5" y="3" width="2.8" height="18" fill="currentColor" /><rect x="12" y="15" width="10" height="6" fill="currentColor" /></svg>
          <span class="boot-name">Lactic</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
