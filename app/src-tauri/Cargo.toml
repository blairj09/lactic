[package]
name = "lactic"
version = "0.1.5"
description = "Lactic: an open-source cycling coach for your computer"
authors = ["James Blair"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "lactic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
base64 = "0.22"
axum = "0.8"
rand = "0.8"
dirs = "5"
os_info = { version = "3", default-features = false }
aes-gcm = "0.10"
if-addrs = "0.13"

# Desktop only: one window per computer, self-updates (the iPhone app updates through the App Store).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Bluetooth through btleplug everywhere but Android, where the phone plugin's Kotlin side does it
# (src/ble_android.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
btleplug = { version = "0.11", features = ["serde"] }

# The phone apps: the pairing QR code, and Apple Health / Health Connect plus the link to the computer.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-lactic-phone = { path = "plugins/lactic-phone" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder"] }
# The iPhone's direct Wi-Fi link (AirDrop-style, phone.rs `direct`): a socket that also takes
# peer-to-peer Wi-Fi, advertised over Bonjour.
libc = "0.2"
socket2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
